name: 发送图片到企业微信

on:
  workflow_dispatch:
  push:                    # 新增：任何push都会触发
    branches:
      - main              # 改为你的默认分支名
  schedule:
    - cron: '* * * * *'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 发送图片
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python send.py
