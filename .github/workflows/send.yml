name: 发送图片到企业微信

on:
  workflow_dispatch:  # 手动触发按钮
  schedule:
    - cron: '3 16 * * *'  # 北京时间凌晨0:03（UTC 16:03）

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4
      
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install requests
      
      - name: 发送图片
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python send.py
