name: 发送图片到企业微信

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 4 * * *'  # 北京时间 12:00（UTC 4:00）

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4
      
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install requests
      
      - name: 发送图片
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python send.py
