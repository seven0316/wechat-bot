name: 发送图片到企业微信

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # 🧪 测试用：每5分钟执行一次（测试完删除）
    - cron: '0 4 * * *'    # 北京时间 12:00
    - cron: '0 10 * * *'   # 北京时间 18:00
    - cron: '30 12 * * *'  # 北京时间 20:30

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4
      
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install requests
      
      - name: 发送图片
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python send.py
